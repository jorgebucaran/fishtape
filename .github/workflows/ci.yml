name: CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            install: sudo add-apt-repository --yes ppa:fish-shell/release-4 && sudo apt-get install --yes fish
          - os: macos-latest
            install: brew install fish
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: ${{ matrix.install }}
      - run: source functions/fishtape.fish && fishtape tests/*.fish
        shell: fish {0}
