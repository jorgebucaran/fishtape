name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}

    strategy:
      matrix:
        image:
          - alpine:3.17
          - alpine:3.20
          - alpine:3.22
          - alpine:edge

    steps:
      - uses: actions/checkout@v4
      - run: apk add --no-cache fish
      - run: source functions/fishtape.fish && fishtape tests/*.fish
        shell: fish {0}
